name: Feature request
description: Propose a focused, safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What editing workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and scope
      options:
        - label: This request does not require automatic source-media deletion, moving, renaming, or overwriting.
          required: true
        - label: This request does not require hidden telemetry, accounts, licensing, or remote services.
          required: true
